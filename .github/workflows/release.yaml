name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and sign only: skip notarization and release publishing"
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      HAS_SIGNING_CERT: ${{ secrets.DISTRIBUTION_CERTIFICATE != '' }}
      HAS_NOTARIZATION: ${{ secrets.DISTRIBUTION_CERTIFICATE != '' && secrets.APPLE_ID != '' && secrets.APPLE_TEAM_ID != '' && secrets.APPLE_APP_SPECIFIC_PASSWORD != '' }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer

      - name: Import signing certificate
        if: env.HAS_SIGNING_CERT == 'true'
        uses: Apple-Actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.DISTRIBUTION_CERTIFICATE }}
          p12-password: ${{ secrets.DISTRIBUTION_CERTIFICATE_PASSWORD }}

      - name: Archive
        run: |
          if [ "$HAS_SIGNING_CERT" = "true" ]; then
            xcodebuild -scheme Stats -destination 'platform=macOS' -configuration Release archive -archivePath build/Stats.xcarchive
          else
            xcodebuild -scheme Stats -destination 'platform=macOS' -configuration Release archive -archivePath build/Stats.xcarchive CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO
          fi

      - name: Export
        run: |
          if [ "$HAS_SIGNING_CERT" = "true" ]; then
            xcodebuild -exportArchive -exportOptionsPlist exportOptions.plist -archivePath build/Stats.xcarchive -exportPath build
          else
            cp -R build/Stats.xcarchive/Products/Applications/Stats.app build/Stats.app
            codesign --force --deep --sign - build/Stats.app
          fi

      - name: Notarize
        if: inputs.dry_run != true && env.HAS_NOTARIZATION == 'true'
        run: |
          xcrun notarytool submit build/Stats.zip \
            --apple-id "${{ secrets.APPLE_ID }}" \
            --team-id "${{ secrets.APPLE_TEAM_ID }}" \
            --password "${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}" \
            --wait

      - name: Staple
        if: inputs.dry_run != true && env.HAS_NOTARIZATION == 'true'
        run: xcrun stapler staple build/Stats.app

      - name: Verify signatures
        run: |
          codesign --verify --strict "build/Stats.app/Contents/PlugIns/WidgetsExtension.appex"
          app=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" build/Stats.app/Contents/Info.plist)
          widget=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "build/Stats.app/Contents/PlugIns/WidgetsExtension.appex/Contents/Info.plist")
          echo "app: $app, widget: $widget"
          [ "$app" = "$widget" ] || { echo "ERROR: widget version does not match app version"; exit 1; }

      - name: Verify gatekeeper
        if: inputs.dry_run != true && env.HAS_NOTARIZATION == 'true'
        run: spctl -a -t exec -vvv build/Stats.app

      - name: Package ZIP
        run: ditto -c -k --sequesterRsrc --keepParent build/Stats.app build/Stats.app.zip

      - name: DMG
        run: |
          git clone --depth 1 https://github.com/create-dmg/create-dmg
          ./create-dmg/create-dmg \
            --volname Stats \
            --background "./Stats/Supporting Files/background.png" \
            --window-pos 200 120 \
            --window-size 500 320 \
            --icon-size 80 \
            --icon "Stats.app" 125 175 \
            --hide-extension "Stats.app" \
            --app-drop-link 375 175 \
            --no-internet-enable \
            build/Stats.dmg build/Stats.app
          rm -rf ./create-dmg

      - name: Upload packages
        if: inputs.dry_run == true
        uses: actions/upload-artifact@v4
        with:
          name: Stats-packages
          path: |
            build/Stats.dmg
            build/Stats.app.zip

      - name: Publish
        if: inputs.dry_run != true
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/Stats.dmg
            build/Stats.app.zip
          body_path: ./RELEASE_NOTES.md
